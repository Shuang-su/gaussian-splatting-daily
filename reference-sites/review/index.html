<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考站对照</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui;background:#eee;color:#222}header{display:flex;align-items:center;gap:20px;padding:16px 24px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap}h1{font-size:20px;margin:0}select,button{font:inherit;padding:6px 10px}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ccc}section{background:#eee;min-width:0}h2{font-size:15px;text-align:center;margin:0;padding:10px;background:#fafafa}.pane{height:calc(100vh - 135px);overflow:auto;text-align:center;background:#ddd}.pane img{display:block;max-width:100%;height:auto;margin:0 auto}output{font-size:12px;color:#666}a{color:#333}@media(max-width:700px){header{gap:8px;padding:10px}.pane{height:75vh}main{grid-template-columns:1fr}}</style>
<header><h1>参考站对照</h1><select id="page" aria-label="页面"><option value="sspai-daily">少数派 · 派早报</option><option value="sspai-home">少数派 · 首页</option><option value="sspai-list">少数派 · 派早报列表</option><option value="rf-home">Radiance Fields · 首页</option><option value="rf-article">Radiance Fields · Spirula</option><option value="rf-papers">Radiance Fields · 论文</option><option value="rf-tools">Radiance Fields · 工具</option></select><select id="width" aria-label="视口"><option>1440</option><option>390</option><option>375</option><option>430</option><option>768</option><option>1024</option></select><label><input id="sync" type="checkbox" checked>同步滚动</label><a id="preview" href="http://127.0.0.1:4340/post/115197" target="_blank">打开本地页面</a><output id="metrics"></output></header>
<main><section><h2>原站采集</h2><div class="pane" id="source"><img alt="原站截图"></div></section><section><h2>本地实现</h2><div class="pane" id="local"><img alt="本地截图"></div></section></main>
<script>
const page=document.querySelector('#page'),width=document.querySelector('#width'),a=document.querySelector('#source'),b=document.querySelector('#local');
const urls={'sspai-home':'http://127.0.0.1:4340/','sspai-list':'http://127.0.0.1:4340/tag/派早报','sspai-daily':'http://127.0.0.1:4340/post/115197','rf-home':'http://127.0.0.1:4341/','rf-article':'http://127.0.0.1:4341/spirula-studio-v2026.9.30-trains-large-scenes-in-parts-and-merges-them','rf-papers':'http://127.0.0.1:4341/papers','rf-tools':'http://127.0.0.1:4341/platforms'};
async function update(){const name=page.value+'-'+width.value;a.querySelector('img').src='source/'+name+'.jpg';b.querySelector('img').src='qa/'+name+'.jpg';document.querySelector('#preview').href=urls[page.value];a.scrollTop=b.scrollTop=0;try{const [x,y]=await Promise.all([fetch('source/'+name+'.json').then(r=>r.json()),fetch('qa/'+name+'.json').then(r=>r.json())]);document.querySelector('#metrics').textContent=`原站 ${x.layout.scrollHeight}px · 本地 ${y.height}px`;}catch{document.querySelector('#metrics').textContent='';}}
let lock=false;for(const[x,y]of[[a,b],[b,a]])x.addEventListener('scroll',()=>{if(!document.querySelector('#sync').checked||lock)return;lock=true;y.scrollTop=x.scrollTop;requestAnimationFrame(()=>lock=false);});page.onchange=width.onchange=update;update();
</script></html>
