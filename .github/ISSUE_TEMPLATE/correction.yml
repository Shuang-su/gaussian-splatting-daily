name: Daily 内容纠错
description: 报告事实、来源、链接、日期或摘要错误
title: "[Correction] "
labels: []

body:
  - type: input
    id: daily_date
    attributes:
      label: Daily 日期
      description: 例如 2026-09-29
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: input
    id: entry
    attributes:
      label: 条目 ID / 标题
      description: arXiv ID、项目名或条目标题
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 说明哪里不正确
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据 / 原始来源
      description: 尽量提供 primary source
    validations:
      required: true

  - type: textarea
    id: proposed_fix
    attributes:
      label: 建议修正
