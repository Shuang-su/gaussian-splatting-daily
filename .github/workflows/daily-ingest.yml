name: Daily Gaussian Splatting Ingest

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      date:
        description: "Logical date YYYY-MM-DD; blank = today in Asia/Tokyo"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gaussian-splatting-daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GSD_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GSD_BOT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve logical date
        id: meta
        shell: bash
        env:
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          DATE="$DISPATCH_DATE"
          if [[ -z "$DATE" ]]; then
            DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 2
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch=automation/daily/$DATE" >> "$GITHUB_OUTPUT"

      - name: Prepare deterministic automation branch
        shell: bash
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git config user.name "gaussian-splatting-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit origin/main; then
              git merge --abort
              echo "Automation branch conflicts with main." >&2
              exit 42
            fi
          else
            git switch -c "$BRANCH" origin/main
          fi

      - name: Generate Daily
        env:
          DATE: ${{ steps.meta.outputs.date }}
        run: python scripts/generate_daily.py --date "$DATE"

      - name: Build site/search index
        run: python scripts/build_index.py

      - name: Validate before publishing
        env:
          DATE: ${{ steps.meta.outputs.date }}
        run: python scripts/validate_daily.py --date "$DATE"

      - name: Commit and push Daily branch
        id: commit
        env:
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git config user.name "gaussian-splatting-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data state
          if git diff --cached --quiet; then
            echo "No content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs(daily): $DATE"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]]; then
            git push --set-upstream origin "$BRANCH"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create, record, and merge Daily PR
        if: steps.commit.outputs.publishable == 'true'
        shell: bash
        env:
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          MARKER="<!-- daily-key:$DATE -->"
          python scripts/publish_summary.py --date "$DATE" --output-dir /tmp/daily-summary

          ISSUE_NUMBER="$(
            gh issue list               --repo "$GITHUB_REPOSITORY"               --state all               --limit 1000               --json number,body               --jq ".[] | select(.body != null and (.body | contains(\"$MARKER\"))) | .number"               | head -n 1
          )"

          if [[ -z "$ISSUE_NUMBER" ]]; then
            ISSUE_URL="$(
              gh issue create                 --repo "$GITHUB_REPOSITORY"                 --title "$(cat /tmp/daily-summary/issue-title.txt)"                 --body-file /tmp/daily-summary/issue-body.md
            )"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"                 --title "$(cat /tmp/daily-summary/issue-title.txt)"                 --body-file /tmp/daily-summary/issue-body.md
          fi
          python scripts/publish_summary.py --date "$DATE" --output-dir /tmp/daily-summary --issue-number "$ISSUE_NUMBER"

          PR_NUMBER="$(
            gh pr list               --repo "$GITHUB_REPOSITORY"               --state open               --head "$BRANCH"               --base main               --limit 10               --json number               --jq '.[0].number // empty'
          )"

          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL="$(
              gh pr create                 --repo "$GITHUB_REPOSITORY"                 --base main                 --head "$BRANCH"                 --title "$(cat /tmp/daily-summary/pr-title.txt)"                 --body-file /tmp/daily-summary/pr-body.md
            )"
            PR_NUMBER="${PR_URL##*/}"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"                 --title "$(cat /tmp/daily-summary/pr-title.txt)"                 --body-file /tmp/daily-summary/pr-body.md
          fi

          echo "Daily content was validated in this workflow; squash-merging PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER"             --repo "$GITHUB_REPOSITORY"             --squash             --delete-branch
