name: Validate Daily Content

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/**"
      - "state/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate all Daily files
        run: python scripts/validate_daily.py --all

      - name: Run publication and editorial regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated index is current
        run: |
          python scripts/build_index.py
          git diff --exit-code -- data/daily-index.json
